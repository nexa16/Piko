<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piko — Icon-Vergleich</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1e293b; background: #fff; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; max-width: 800px; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
    th:first-child { width: 31%; }
    thead th { padding: 12px 2px 16px; font-size: 16px; font-weight: 650; }
    thead th:first-child { text-align: left; color: #526177; font-weight: 450; }
    tbody th { text-align: left; font-weight: 500; padding: 18px 6px 18px 0; overflow-wrap: anywhere; }
    td { text-align: center; padding: 18px 2px; }
    tbody tr { border-top: 1px solid #e7ecf3; }
    img { display: inline-block; width: 48px; height: 48px; vertical-align: middle; }
    td:hover { background: #e7eefc; border-radius: 8px; }
    .notes { color: #526177; font-size: 13px; line-height: 1.5; margin: 14px 0 0; }
    a { color: #2956b8; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #2956b8; outline-offset: 3px; border-radius: 2px; }
    .licenses { font-size: 13px; line-height: 1.6; margin: 8px 0 0; }
    @media(max-width:450px){body{padding:10px}table{font-size:12px}thead th{font-size:12px}img{width:36px;height:36px}td{padding:14px 2px}.notes,.licenses{font-size:12px}}
  </style>
</head>
<body>
  <table aria-label="Fünf mögliche Piko-Icons im Vergleich">
    <thead><tr><th scope="col">Anwendung</th><th scope="col">Lucide</th><th scope="col">Phosphor</th><th scope="col">Tabler</th></tr></thead>
    <tbody>
      <tr><th scope="row" data-copy="collection.vocabulary"></th><td><img src="assets/icons/lucide/book-open.svg" alt="Lucide: offenes Buch"></td><td><img src="assets/icons/phosphor/book-open.svg" alt="Phosphor: offenes Buch"></td><td><img src="assets/icons/tabler/book.svg" alt="Tabler: Buch"></td></tr>
      <tr><th scope="row" data-copy="collection.search"></th><td><img src="assets/icons/lucide/search.svg" alt="Lucide: Lupe"></td><td><img src="assets/icons/phosphor/magnifying-glass.svg" alt="Phosphor: Lupe"></td><td><img src="assets/icons/tabler/search.svg" alt="Tabler: Lupe"></td></tr>
      <tr><th scope="row" data-copy="action.addEntry"></th><td><img src="assets/icons/lucide/plus.svg" alt="Lucide: Plus"></td><td><img src="assets/icons/phosphor/plus.svg" alt="Phosphor: Plus"></td><td><img src="assets/icons/tabler/plus.svg" alt="Tabler: Plus"></td></tr>
      <tr><th scope="row" data-copy="nav.statistics"></th><td><img src="assets/icons/lucide/chart-no-axes-column.svg" alt="Lucide: Säulendiagramm"></td><td><img src="assets/icons/phosphor/chart-bar.svg" alt="Phosphor: Säulendiagramm"></td><td><img src="assets/icons/tabler/chart-bar.svg" alt="Tabler: Säulendiagramm"></td></tr>
      <tr><th scope="row" data-copy="nav.settings"></th><td><img src="assets/icons/lucide/settings.svg" alt="Lucide: Zahnrad"></td><td><img src="assets/icons/phosphor/gear.svg" alt="Phosphor: Zahnrad"></td><td><img src="assets/icons/tabler/settings.svg" alt="Tabler: Zahnrad"></td></tr>
    </tbody>
  </table>
  <p class="notes">Alle Icons gleich groß: 48 × 48 px, auf schmalen Bildschirmen 36 × 36 px. Lucide und Tabler: Outline; Phosphor: Regular. Originale Formen und Strichstärken bleiben erhalten.</p>
  <p class="licenses"><a href="assets/icons/SOURCES.md" target="_blank" rel="noopener">Offizielle Quellen</a> · Lizenzen: <a href="assets/icons/lucide/LICENSE.txt" target="_blank" rel="noopener">Lucide (ISC)</a>, <a href="assets/icons/phosphor/LICENSE.txt" target="_blank" rel="noopener">Phosphor (MIT)</a>, <a href="assets/icons/tabler/LICENSE.txt" target="_blank" rel="noopener">Tabler (MIT)</a></p>
  <script src="../shared/copy.js"></script>
  <script>
    document.querySelectorAll('[data-copy]').forEach(element => {
      element.textContent = PIKO_COPY.entries[element.dataset.copy].de;
    });
  </script>
</body>
</html>
