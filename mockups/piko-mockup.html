<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piko Mockup</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#24372d;background:#edf1ed}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}.layout{max-width:1060px;margin:auto;min-height:100vh;display:grid;grid-template-columns:220px 1fr;background:#f7f9f6}aside{padding:32px 20px;background:white;border-right:1px solid #e2e9e2}.brand{font-size:30px;font-weight:850;color:#397d64;letter-spacing:-2px;margin-bottom:38px}.nav{display:grid;gap:8px}.nav button,.bottom button{border:0;background:transparent;color:#7a897d;text-align:left;padding:13px;border-radius:12px;font-weight:700}.nav .active,.bottom .active{background:#e7f3eb;color:#397d64}main{width:100%;max-width:760px;margin:auto;padding:38px 34px 100px}.eyebrow{font-size:11px;color:#9aa99d;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}h1{font-size:31px;letter-spacing:-1px;margin:7px 0}h2{font-size:16px}.sub,.meta{color:#839187;font-size:13px}.head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.head{margin:27px 0 14px}.stack{display:grid;gap:12px}.card{background:#fff;border:1px solid #e1e8e1;border-radius:19px;padding:19px}.click{cursor:pointer}.click:hover{border-color:#a4c7af}.btn{border:1px solid #dfe7df;background:#fff;border-radius:11px;padding:11px 14px;color:#294335;font-weight:700;font-size:13px}.primary{background:#397d64;border-color:#397d64;color:white}.tint{background:#e7f3eb;border-color:#e7f3eb;color:#397d64}.ghost{border:0;background:transparent;color:#397d64}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}.cover{height:48px;width:48px;background:#e7f3eb;border-radius:14px;display:grid;place-items:center;font-weight:800;color:#397d64}.book{display:flex;align-items:center;gap:13px}.book h3{margin:0 0 5px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:white;border:1px solid #e1e8e1;border-radius:15px;padding:15px}.stat strong{display:block;font-size:25px}.stat span{font-size:11px;color:#849188}.input{width:100%;padding:13px;border:1px solid #dfe7df;border-radius:12px;background:#fff}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:13px 0}.pill{display:inline-block;background:#f0f4ef;color:#78877b;font-size:11px;padding:5px 9px;border-radius:30px;margin:6px 4px 0 0}.back{border:0;background:none;color:#397d64;padding:0;margin-bottom:18px;font-weight:750}.placeholder{border:1.5px dashed #d6e1d7;border-radius:16px;background:#fbfcfa;padding:28px;text-align:center;color:#8c9c90}.field{display:grid;gap:7px;margin:17px 0}.field label{font-size:12px;color:#75877a;font-weight:750}.learning{min-height:290px;display:grid;place-items:center;text-align:center;cursor:pointer}.word{font-size:37px;font-weight:750}.progress{height:7px;background:#e2ebe3;border-radius:9px;margin:16px 0;overflow:hidden}.progress div{height:100%;width:40%;background:#397d64}.bottom{display:none}.overlay{position:fixed;inset:0;background:#15251c88;display:grid;place-items:center;padding:16px}.modal{background:#fff;border-radius:20px;padding:24px;width:min(430px,100%)}.fab{position:fixed;right:max(25px,calc((100vw - 1060px)/2 + 30px));bottom:25px;border:0;background:#397d64;color:white;padding:16px 20px;border-radius:15px;font-weight:800}.caption{font-size:11px;color:#a0aea2;margin-top:20px}@media(max-width:680px){:root{background:#f7f9f6}.layout{display:block}aside{display:none}main{padding:24px 18px 110px;max-width:520px}h1{font-size:29px}.bottom{display:flex;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;background:#ffffffef;border-top:1px solid #e1e8e1;padding:10px 5px 16px}.bottom button{font-size:12px;padding:10px}.fab{right:20px;bottom:82px}.stat{padding:12px}.stat strong{font-size:21px}}
</style><div class="layout"><aside><div class="brand">piko</div><div class="nav" id="nav"></div><p class="caption">Navigation prototype · v0.1<br>Mock data only</p></aside><main id="app"></main></div><div class="bottom" id="bottom"></div><div id="overlay"></div><script>
const books=[['Korean Basics','Korean · German','한',128,24,16],['French A1','French · German','FR',64,8,6],['English Notes','English · German','EN',32,4,3]],words=[['사과','Apfel','Food'],['물','Wasser','Food'],['학교','Schule','Education'],['친구','Freund','People'],['책','Buch','Education']];let s={page:'collections',book:0,mode:'long',direction:'KO → DE',answer:'Self',revealed:false,search:'',compact:false,modal:'',importStep:0};const app=document.getElementById('app');function go(p){s.page=p;s.revealed=false;render();scrollTo(0,0)}function change(k,v){s[k]=v;render()}function back(p){return `<button class="back" onclick="go('${p}')">← Back</button>`}function title(k,t,d){return `<div class="eyebrow">${k}</div><h1>${t}</h1><div class="sub">${d}</div>`}function learn(i,m){s.book=i;s.mode=m;go('learning')}function popup(m){s.modal=m;overlay()}function overlay(){document.getElementById('overlay').innerHTML=s.modal?`<div class="overlay" onclick="popup('')"><div class="modal" onclick="event.stopPropagation()"><h2>${s.modal}</h2><p class="sub">This interaction will be refined in a later mockup iteration.</p><button class="btn primary" onclick="popup('')">Close</button></div></div>`:''}function navigation(){for(const id of ['nav','bottom'])document.getElementById(id).innerHTML=[['collections','▦ Collections'],['stats','▥ Statistics'],['settings','⚙ Settings']].map(([p,l])=>`<button class="${s.page===p?'active':''}" onclick="go('${p}')">${l}</button>`).join('')}
function overview(){return title('Your space','Collections','Browse collections or start learning.')+`<div class="head"><h2>My collections</h2><button class="btn ghost" onclick="popup('New Collection')">+ New</button></div><div class="stack">${books.map((b,i)=>`<div class="card click" onclick="s.book=${i};go('detail')"><div class="book"><div class="cover">${b[2]}</div><div style="flex:1"><h3>${b[0]}</h3><div class="meta">${b[1]} · ${b[3]} entries</div></div><span>›</span></div><div class="actions"><button class="btn tint" onclick="event.stopPropagation();learn(${i},'long')">↗ Learn · ${b[4]}</button><button class="btn" onclick="event.stopPropagation();learn(${i},'speed')">⚡ Speed · ${b[5]}</button></div></div>`).join('')}</div><div class="head"><h2>Today</h2><button class="btn ghost" onclick="go('stats')">Activity →</button></div><div class="stats"><div class="stat"><strong>36</strong><span>Due</span></div><div class="stat"><strong>18</strong><span>Reviewed</span></div><div class="stat"><strong>7</strong><span>Day streak</span></div></div>`}
function detail(){let b=books[s.book];return back('collections')+title('Collection',b[0],`${b[1]} · ${b[3]} entries`)+`<div class="actions"><button class="btn primary" onclick="learn(${s.book},'long')">↗ Long-term · ${b[4]}</button><button class="btn tint" onclick="learn(${s.book},'speed')">⚡ Speed · ${b[5]}</button></div><div class="head"><h2>Vocabulary</h2><button class="btn ghost" onclick="go('categories')">Categories →</button></div><input class="input" placeholder="Search both languages…" value="${s.search}" oninput="s.search=this.value;drawWords()"><div class="tools"><button class="btn" onclick="popup('Filters')">☷ Filters</button><button class="btn" onclick="popup('Grouping')">▤ Group</button><button class="btn" onclick="change('compact',!s.compact)">${s.compact?'Compact':'Detailed'}</button><button class="btn" onclick="go('import')">⇧ Import</button></div><div id="wordlist"></div><button class="fab" onclick="go('entry')">+ Add Entry</button>`}
function drawWords(){let el=document.getElementById('wordlist');if(!el)return;el.innerHTML=`<div class="stack">${words.filter(w=>w.join(' ').toLowerCase().includes(s.search.toLowerCase())).map(w=>`<div class="card row click" onclick="popup('Vocabulary Detail')"><div><strong>${w[0]}</strong><div class="meta">${w[1]}</div>${s.compact?'':`<span class="pill">${w[2]}</span><span class="pill">Unit 2</span>`}</div><span>›</span></div>`).join('')}</div>`}
function learning(){return back('detail')+title(s.mode==='long'?'Long-term Learning':'Speed Learning',books[s.book][0],`${s.direction} · ${s.mode==='long'?'12 / 30 completed · 9 first-try correct':'Active pool: 5'}`)+`<div class="progress"><div></div></div><div class="row"><span class="pill">${s.direction}</span><button class="btn" onclick="change('answer',s.answer==='Self'?'Type':'Self')">${s.answer} ▾</button></div><div class="card learning" onclick="change('revealed',!s.revealed)"><div><div class="word">${s.revealed?'사과':'Apfel'}</div><p class="sub">${s.revealed?'저는 사과를 먹어요.':'Ich esse einen Apfel.'}</p></div><span class="meta">${s.revealed?'Answer revealed':'Tap to reveal'}</span></div><div class="actions">${s.revealed?`<button class="btn" onclick="popup('Previous Card')">↶ Previous</button><button class="btn" onclick="change('revealed',false)">Incorrect</button><button class="btn primary" onclick="change('revealed',false)">Correct</button>`:`${s.answer==='Type'?'<input class="input" style="flex:1;min-width:120px" placeholder="Type answer">':''}<button class="btn primary" onclick="change('revealed',true)">Show Answer</button><button class="btn" onclick="popup('Skip')">Skip</button>`}</div><p class="caption">Learning Card is intentionally simplified for navigation testing.</p>`}
function entry(){return back('detail')+title('Vocabulary','Add Entries','Manual entry session · basic structure')+`<div class="card"><div class="field"><label>Korean</label><input class="input" placeholder="Target word"></div><div class="field"><label>German</label><input class="input" placeholder="Native translation"></div><div class="placeholder">Example pairs, hints and categories will be designed later.</div><div class="actions"><button class="btn primary" onclick="popup('Saved — Next Entry')">Save & Next</button><button class="btn" onclick="go('detail')">Finish</button></div></div>`}
function categories(){return back('detail')+title('Collection Settings','Categories','Dimensions and values')+`<div class="stack">${['Topic','Unit','Source','Difficulty'].map(x=>`<div class="card row click" onclick="popup('${x} Category')"><strong>${x}</strong><span>›</span></div>`).join('')}</div><div class="actions"><button class="btn tint" onclick="popup('New Dimension')">+ Add dimension</button></div>`}
function imports(){return back('detail')+title('Import','Import Vocabulary','Extract, review, then confirm')+`<div class="actions"><button class="btn ${s.importStep===0?'primary':''}" onclick="change('importStep',0)">1. Select</button><button class="btn ${s.importStep===1?'primary':''}" onclick="change('importStep',1)">2. Review</button></div>${s.importStep===0?`<div class="placeholder" style="margin-top:16px">⇧<h3>Upload image or PDF</h3><p>File extraction is not implemented in this navigation mockup.</p><button class="btn tint" onclick="change('importStep',1)">View sample review →</button></div>`:`<div class="stats" style="margin:17px 0"><div class="stat"><strong>12</strong><span>New</span></div><div class="stat"><strong>8</strong><span>Additions</span></div><div class="stat"><strong>2</strong><span>Conflicts</span></div></div><div class="card"><strong>사과 — Apfel</strong><p class="sub">Proposed: + Food, + Active Korean 1</p><button class="btn" onclick="popup('Review Entry')">Review differences</button></div><div class="actions"><button class="btn primary" onclick="popup('Confirm Import')">Confirm import</button></div>`}`}
function stats(){return title('Your progress','Statistics','Long-term learning · all collections')+`<div class="stats" style="margin-top:22px"><div class="stat"><strong>42</strong><span>Avg / active day</span></div><div class="stat"><strong>7</strong><span>Day streak</span></div><div class="stat"><strong>86</strong><span>Reviewed today</span></div></div><div class="head"><h2>Learning activity</h2><button class="btn ghost" onclick="popup('Speed Statistics')">Speed stats →</button></div><div class="stack">${[['Today · Oct 13','86 reviewed · 63 first-try correct'],['Yesterday · Oct 12','54 reviewed · 43 first-try correct'],['Oct 11','31 reviewed · 24 first-try correct']].map(x=>`<div class="card"><strong>${x[0]}</strong><p class="meta">${x[1]}</p></div>`).join('')}</div><div class="actions"><button class="btn" onclick="popup('More History')">Show more history</button></div>`}
function settings(){return title('Preferences','Settings','App-wide preferences and learning defaults')+`<div class="stack" style="margin-top:23px"><div class="card"><h2>General</h2><div class="field"><label>App language</label><select class="input"><option>English</option><option>Deutsch</option></select></div></div><div class="card"><h2>Learning preferences</h2><div class="field"><label>Preferred direction</label><select class="input"><option>Target → Native</option><option>Native → Target</option><option>Both · Separate</option><option>Both · Mixed</option></select></div><div class="field"><label>Default answer mode</label><select class="input"><option>Self Assessment</option><option>Typed Answer</option></select></div></div><div class="card row click" onclick="popup('AI Assistance Settings')"><strong>AI Assistance</strong><span>›</span></div><div class="card row click" onclick="popup('Developer Learning Parameters')"><strong>Developer Settings</strong><span>›</span></div></div>`}
function render(){navigation();app.innerHTML=({collections:overview,detail,learning,entry,categories,import:imports,stats,settings}[s.page]||overview)();if(s.page==='detail')drawWords();overlay()}render();
</script></html>
