name: piko
description: "Piko local-first vocabulary learning application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.5.1
  unorm_dart: 0.3.3
  sqlite3: ^3.5.2
  flutter_svg: 2.3.0
  fsrs: 2.0.1
  file_picker: 13.1.0
  intl: 0.20.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: Piko Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans.ttf
          weight: 800
    - family: Piko Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKR.ttf
          weight: 600
        - asset: assets/fonts/NotoSansKR.ttf
          weight: 700
        - asset: assets/fonts/NotoSansKR.ttf
          weight: 800
  assets:
    - assets/fonts/NunitoSans-OFL.txt
    - assets/fonts/NotoSansKR-OFL.txt
    - assets/generated/lucide/
    - assets/brand/piko-reading.png
    - assets/brand/piko-star.png
    - assets/brand/piko-celebration.png
    - assets/brand/piko-sleeping.png
