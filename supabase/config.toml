project_id = "piko-owner-ai"

[functions.piko-ai]
enabled = true
verify_jwt = true
entrypoint = "./functions/piko-ai/index.ts"

# Internal scheduler calls use a separate random secret checked by the worker.
# Disabled until the reviewed deployment explicitly enables this function.
[functions.piko-ai-review-worker]
enabled = false
verify_jwt = false
entrypoint = "./functions/piko-ai-review-worker/index.ts"

# Optional private AI access; ordinary local app flows never require Auth.
[auth]
enable_anonymous_sign_ins = true
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.rate_limit]
anonymous_users = 10
